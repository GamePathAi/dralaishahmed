# =============================================================================
#  nginx - www.dralaishahmed.com.br
#  Site estatico. Canonico COM www; a raiz redireciona para www.
#
#  Servidor: EC2 i-055e8cd090d946eb7 (sa-east-1b) - Ubuntu 26.04 LTS
#  IP fixo:  15.229.195.141   (Elastic IP "dralaishahmed-site")
#  Instancia DEDICADA a este site.
#
#  Nao confundir: 18.230.185.35 e do bonafeadvogados.com.br, em outra
#  instancia (i-0f45bae7bdf89b345).
#
#  O bloco do www e default_server: assim o site tambem responde quando se
#  acessa o IP direto, o que permite testar antes do dominio existir.
#
#  Instalacao (Ubuntu):
#    sudo cp nginx-dralaishahmed.conf /etc/nginx/sites-available/dralaishahmed
#    sudo ln -s /etc/nginx/sites-available/dralaishahmed \
#               /etc/nginx/sites-enabled/dralaishahmed
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Este arquivo tem SO os blocos da porta 80, de proposito: nginx nao sobe
#  bloco SSL sem certificado, e uma falha aqui derrubaria o site do escritorio
#  junto. Depois que o DNS propagar, rode:
#
#    sudo certbot --nginx -d dralaishahmed.com.br -d www.dralaishahmed.com.br
#
#  O certbot cria os blocos 443, copia estas configuracoes para dentro deles,
#  converte a porta 80 em redirect e agenda a renovacao automatica.
#
#  Obs.: a AWS ACM nao serve aqui - certificado publico do ACM so instala em
#  ELB, CloudFront e API Gateway, nunca em nginx na propria instancia.
# =============================================================================


# ------------------------------------------- raiz -> www (sem o "www" sobra)
server {
    listen      80;
    listen      [::]:80;
    server_name dralaishahmed.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        # https, nao http: mandar para http aqui faz o visitante passar por
        # texto puro antes do redirect final.
        return 301 https://www.dralaishahmed.com.br$request_uri;
    }
}


# ------------------------------------------------------------------- o site
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name www.dralaishahmed.com.br;

    root  /var/www/dralaishahmed;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/dralaishahmed.access.log;
    error_log  /var/log/nginx/dralaishahmed.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # ---- seguranca -----------------------------------------------------
    # HSTS fica comentado ate o HTTPS estar validado nos dois nomes. Uma vez
    # enviado, o navegador recusa HTTP nesse dominio pelo tempo do max-age e
    # nao ha como desfazer do lado do visitante.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # O site nao carrega nada de terceiros - a CSP pode ser restritiva.
    # 'unsafe-inline' cobre o script de tema no <head> e os style="" das
    # paginas legais.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---- compressao ----------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml;

    # ---- cache ---------------------------------------------------------
    # ATENCAO: usar "expires" e NAO "add_header Cache-Control" aqui.
    # No nginx, um add_header dentro de um location DESCARTA todos os
    # add_header herdados do server. Como "/" faz redirecionamento interno
    # para /index.html e reavalia as locations, um add_header no bloco .html
    # apagaria silenciosamente os seis cabecalhos de seguranca acima.
    # A diretiva "expires" define o cache sem mexer nessa heranca.

    # HTML curto: permite corrigir texto sem esperar o cache do visitante.
    location ~* \.html$ {
        expires 5m;
    }

    # Estaticos longos. Ao trocar uma imagem, renomeie o arquivo
    # (ex.: dra-lais-2.jpg) para o navegador buscar a versao nova.
    location ~* \.(css|js|jpg|jpeg|png|svg|webp|ico|woff2)$ {
        expires 30d;
        access_log off;
    }

    # ---- rotas ---------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Rede de seguranca: bloqueia arquivos que nao deveriam estar no servidor.
    location ~* \.(bat|ps1|md|json|log|conf)$ {
        deny all;
    }

    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }
}


# ------------------------------------------- plataforma de teleconsulta
# consulta.dralaishahmed.com.br -> Next.js (plataforma/) na porta 3000.
#
# Pre-requisitos, nesta ordem:
#   1. DNS: registro A  consulta.dralaishahmed.com.br -> 15.229.195.141
#   2. A plataforma rodando na instancia:  cd plataforma && npm run build
#      && npm run start   (idealmente sob systemd/pm2 para sobreviver a reboot)
#   3. Certificado:  sudo certbot --nginx -d consulta.dralaishahmed.com.br
#
# Sem timeout generoso de proxy o pipeline de notas quebra: cada requisicao e
# curta por desenho, mas o upload da sala e as chamadas de IA passam dos 60s
# padrao em conexoes lentas.
server {
    listen      80;
    listen      [::]:80;
    server_name consulta.dralaishahmed.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (hot reload em dev; upgrades do Next em geral).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A aplicacao le x-forwarded-for para a trilha de auditoria.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Audio de consulta longa passa folgado do 1m padrao.
        client_max_body_size 100m;
    }
}
