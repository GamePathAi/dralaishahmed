# =============================================================================
#  nginx - consulta.dralaishahmed.com.br  (plataforma clínica, Next.js :3000)
#
#  Config VIVA em produção, versionada aqui para não regredir num redeploy.
#  Instalada em:
#    /etc/nginx/conf.d/dralais-limits.conf        (zonas de rate limit — http)
#    /etc/nginx/snippets/dralais-proxy.conf       (bloco proxy reutilizado)
#    /etc/nginx/sites-available/dralais-consulta   (o server abaixo)
#
#  As linhas "managed by Certbot" são geradas pelo certbot — NÃO remover ao
#  editar, senão o TLS quebra. Depois de qualquer mudança:
#    sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# --- /etc/nginx/conf.d/dralais-limits.conf (contexto http) -------------------
#
#   limit_req_zone $binary_remote_addr zone=dralais_geral:10m   rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=dralais_login:10m   rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=dralais_agendar:10m rate=20r/m;
#   limit_req_status 429;
#
#   dralais_agendar subiu de 6r/m -> 20r/m por causa de CGNAT: operadoras móveis
#   colocam muitos pacientes reais atrás de um mesmo IP público, e um anúncio
#   pago manda justamente tráfego de celular. A borda agora só barra flood bruto;
#   o limite fino por IDENTIDADE (IP 20/10min + e-mail 3/10min) vive no app, em
#   src/app/api/consultas/route.ts, onde não pune vizinho de NAT.

# --- /etc/nginx/snippets/dralais-proxy.conf ----------------------------------
#
#   proxy_pass         http://127.0.0.1:3000;
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection "upgrade";
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;   # IP não-forjável (auditoria)
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 300s;
#   proxy_send_timeout 300s;

# --- /etc/nginx/sites-available/dralais-consulta -----------------------------
server {
    server_name consulta.dralaishahmed.com.br;

    # Áudio da consulta vai DIRETO ao S3 (URL pré-assinada); nenhuma rota do app
    # recebe upload grande. 2m cobre o JSON e corta DoS por corpo gigante.
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Login da médica: senha+TOTP são caros (scrypt) e o TOTP é brute-forçável.
    location = /api/auth/callback/credentials {
        limit_req zone=dralais_login burst=3 nodelay;
        include snippets/dralais-proxy.conf;
    }
    # Magic link: cada request dispara e-mail pelo Zoho.
    location = /api/auth/signin/nodemailer {
        limit_req zone=dralais_login burst=2 nodelay;
        include snippets/dralais-proxy.conf;
    }
    # Agendamento público de escrita. Burst folgado para o pico de cliques de um
    # mesmo IP de CGNAT; o limite fino por identidade está no app.
    location = /api/consultas {
        limit_req zone=dralais_agendar burst=10 nodelay;
        include snippets/dralais-proxy.conf;
    }

    location / {
        limit_req zone=dralais_geral burst=20 nodelay;
        include snippets/dralais-proxy.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/consulta.dralaishahmed.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/consulta.dralaishahmed.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS (o app também envia HSTS, fixando https para quem já visitou).
server {
    if ($host = consulta.dralaishahmed.com.br) {
        return 301 https://$host$request_uri;
    }
    listen      80;
    listen      [::]:80;
    server_name consulta.dralaishahmed.com.br;
    return 404;
}
